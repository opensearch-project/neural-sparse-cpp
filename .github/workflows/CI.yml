name: Build and Test nsparse
on:
  push:
    branches:
      - "*"
      - "feature/**"
  pull_request:
    branches:
      - "*"
      - "feature/**"

jobs:
  check-files:
    name: Check files for Build and Test
    runs-on: ubuntu-latest
    outputs:
      RUN_BUILD_AND_TEST: ${{ steps.check.outputs.files_changed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Check files
        id: check
        uses: ./.github/actions/check-files
        with:
          files: .github/workflows/CI.yml,python_tests/**

  Get-CI-Image-Tag:
    needs: check-files
    if: needs.check-files.outputs.RUN_BUILD_AND_TEST == 'true'
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@6631dc102f1e64c182eccfc48a319a87bc9079f6 # main
    with:
      product: opensearch

  Build-nsparse-Linux:
    name: Build and Test nsparse on Linux (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: Get-CI-Image-Tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    # ci-image-version-linux is a multi-arch manifest, so the same tag resolves
    # to the arm64 image on an arm64 runner.
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Generic build
      - name: Configure (generic)
        run: |
          cmake -B build \
            -DNSPARSE_ENABLE_TESTS=ON \
            -DNSPARSE_OPT_LEVEL=generic \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build (generic)
        run: cmake --build build -j$(nproc)

      - name: Test (generic)
        run: ctest --test-dir build --output-on-failure

      # Detect SIMD and build+test the best available level
      - name: Detect SIMD capability
        id: detect-simd
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "aarch64" ] || [ "$ARCH" = "arm64" ]; then
            if cat /proc/cpuinfo 2>/dev/null | grep -qi sve; then
              echo "opt_level=sve" >> $GITHUB_OUTPUT
            else
              echo "opt_level=neon" >> $GITHUB_OUTPUT
            fi
          elif [ "$ARCH" = "x86_64" ]; then
            if lscpu | grep -qi avx512f && lscpu | grep -qi avx512cd && lscpu | grep -qi avx512vl && lscpu | grep -qi avx512dq && lscpu | grep -qi avx512bw; then
              echo "opt_level=avx512" >> $GITHUB_OUTPUT
            elif lscpu | grep -qi avx2; then
              echo "opt_level=avx2" >> $GITHUB_OUTPUT
            else
              echo "opt_level=" >> $GITHUB_OUTPUT
            fi
          else
            echo "opt_level=" >> $GITHUB_OUTPUT
          fi

      - name: Configure (SIMD)
        if: steps.detect-simd.outputs.opt_level != ''
        run: |
          rm -rf build
          cmake -B build \
            -DNSPARSE_ENABLE_TESTS=ON \
            -DNSPARSE_OPT_LEVEL=${{ steps.detect-simd.outputs.opt_level }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc" \
            -DCMAKE_SHARED_LINKER_FLAGS="-static-libstdc++ -static-libgcc"

      - name: Build (SIMD)
        if: steps.detect-simd.outputs.opt_level != ''
        run: cmake --build build -j$(nproc)

      - name: Test (SIMD)
        if: steps.detect-simd.outputs.opt_level != ''
        run: ctest --test-dir build --output-on-failure

  Build-nsparse-Python-Linux:
    name: Build and Test nsparse Python bindings on Linux
    needs: check-files
    if: needs.check-files.outputs.RUN_BUILD_AND_TEST == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install SWIG
        run: |
          sudo apt-get update
          sudo apt-get install -y swig

      # Pinned to 3.12 because nsparse/python/pyproject.toml requires numpy<2.0,
      # and numpy 1.26 is the last release supporting that constraint. On 3.13+
      # the pin resolves to a numpy older than the interpreter, which corrupts
      # arrays at runtime rather than failing to install.
      - name: Set up Python
        id: python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install build dependencies
        run: python -m pip install --upgrade pip "numpy<2.0" packaging setuptools wheel pytest

      - name: Configure
        run: |
          cmake -B build \
            -DNSPARSE_ENABLE_PYTHON=ON \
            -DNSPARSE_OPT_LEVEL=generic \
            -DCMAKE_BUILD_TYPE=Release \
            -DPython_EXECUTABLE=${{ steps.python.outputs.python-path }}

      - name: Build
        run: cmake --build build -j$(nproc)

      # --no-deps keeps the numpy installed above. Letting pip re-resolve here can
      # swap numpy after the extension was compiled against its headers, and a
      # mismatched pair corrupts search results instead of erroring.
      - name: Install the built package
        run: |
          cd build/nsparse/python
          python -m pip install --no-deps .

      - name: Import check
        run: python -c "import nsparse; print(nsparse.index_factory)"

      # pytest, not a loop over `python <file>`: the loop only caught a nonzero
      # exit, so a test that computed a wrong answer without asserting passed.
      # -rX surfaces xpasses, which is how a fixed known-issue test announces
      # that its xfail marker should be removed.
      - name: Run Python tests
        run: python -m pytest python_tests -v -rX

  Build-nsparse-MacOS:
    name: Build and Test nsparse on MacOS
    needs: check-files
    if: needs.check-files.outputs.RUN_BUILD_AND_TEST == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install dependencies
        run: brew install libomp abseil

      - name: Detect SIMD capability
        id: detect-simd
        run: |
          if sysctl -n machdep.cpu.features machdep.cpu.leaf7_features 2>/dev/null | grep -qi AVX2; then
            echo "opt_level=avx2" >> $GITHUB_OUTPUT
          elif uname -m | grep -q arm64; then
            echo "opt_level=neon" >> $GITHUB_OUTPUT
          else
            echo "opt_level=generic" >> $GITHUB_OUTPUT
          fi

      # Generic build
      - name: Configure (generic)
        run: |
          cmake -B build \
            -DNSPARSE_ENABLE_TESTS=ON \
            -DNSPARSE_OPT_LEVEL=generic \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY=$(brew --prefix libomp)/lib/libomp.dylib

      - name: Build (generic)
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test (generic)
        run: ctest --test-dir build --output-on-failure

      # SIMD build if different from generic
      - name: Configure (SIMD)
        if: steps.detect-simd.outputs.opt_level != 'generic'
        run: |
          rm -rf build
          cmake -B build \
            -DNSPARSE_ENABLE_TESTS=ON \
            -DNSPARSE_OPT_LEVEL=${{ steps.detect-simd.outputs.opt_level }} \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=/usr/bin/clang \
            -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
            -DOpenMP_CXX_FLAGS="-Xpreprocessor -fopenmp -I$(brew --prefix libomp)/include" \
            -DOpenMP_CXX_LIB_NAMES="omp" \
            -DOpenMP_omp_LIBRARY=$(brew --prefix libomp)/lib/libomp.dylib

      - name: Build (SIMD)
        if: steps.detect-simd.outputs.opt_level != 'generic'
        run: cmake --build build -j$(sysctl -n hw.ncpu)

      - name: Test (SIMD)
        if: steps.detect-simd.outputs.opt_level != 'generic'
        run: ctest --test-dir build --output-on-failure

  Build-nsparse-Windows:
    name: Build and Test nsparse on Windows
    needs: check-files
    if: needs.check-files.outputs.RUN_BUILD_AND_TEST == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Abseil
        run: vcpkg install abseil[core]:x64-windows

      - name: Configure (generic)
        run: |
          cmake -B build `
            -DNSPARSE_ENABLE_TESTS=ON `
            -DNSPARSE_OPT_LEVEL=generic `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (generic)
        run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

      - name: Test (generic)
        run: ctest --test-dir build --build-config Release --output-on-failure

  check-results:
    needs: [check-files, Build-nsparse-Linux, Build-nsparse-Python-Linux, Build-nsparse-MacOS, Build-nsparse-Windows]
    if: always()
    name: Check results
    runs-on: ubuntu-latest
    steps:
      - name: Fail if build or test failed
        if: |
          needs.check-files.outputs.RUN_BUILD_AND_TEST == 'true' &&
          (needs.Build-nsparse-Linux.result == 'failure' || needs.Build-nsparse-Python-Linux.result == 'failure' || needs.Build-nsparse-MacOS.result == 'failure' || needs.Build-nsparse-Windows.result == 'failure')
        run: exit 1
